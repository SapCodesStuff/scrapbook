<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressed Pages — a shared scrapbook journal</title>
  <meta name="description" content="A vintage scrapbook diary for two. Flip pages, press flowers, pin polaroids, and write together in real time.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f4eddc' stroke='%23c3b698'/%3E%3Cg fill='none' stroke='%237a5c3e' stroke-width='1.4'%3E%3Cellipse cx='16' cy='7.5' rx='3' ry='6'/%3E%3Cellipse cx='16' cy='24.5' rx='3' ry='6'/%3E%3Cellipse cx='7.5' cy='16' rx='6' ry='3'/%3E%3Cellipse cx='24.5' cy='16' rx='6' ry='3'/%3E%3Cellipse cx='10' cy='10' rx='4.4' ry='2.6' transform='rotate(-45 10 10)'/%3E%3Cellipse cx='22' cy='10' rx='2.6' ry='4.4' transform='rotate(-45 22 10)'/%3E%3Cellipse cx='10' cy='22' rx='2.6' ry='4.4' transform='rotate(-45 10 22)'/%3E%3Cellipse cx='22' cy='22' rx='4.4' ry='2.6' transform='rotate(-45 22 22)'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23c9a86a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header id="topbar">
    <div class="tb-left">
      <button id="sidebarToggle" class="icon-btn only-compact" aria-label="Toggle stationery drawer" title="Stationery"></button>
      <div class="wordmark">
        <span class="wm-title">Pressed Pages</span>
        <span class="wm-sub">a shared scrapbook journal</span>
      </div>
    </div>

    <nav class="tb-center" aria-label="Book navigation">
      <button id="navPrev" class="icon-btn" aria-label="Previous page" title="Previous (left arrow)"></button>
      <div class="page-indicator" id="pageLabel">Cover</div>
      <button id="navNext" class="icon-btn" aria-label="Next page" title="Next (right arrow)"></button>
      <button id="addLeafBtn" class="chip-btn" title="Add another two pages to the journal">Add pages</button>
    </nav>

    <div class="tb-right">
      <div id="presence" class="presence" title="Who is here"></div>
      <div id="saveStatus" class="save-status" title="Sync status">Local</div>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings" title="Settings"></button>
    </div>
  </header>

  <div id="stage">
    <aside id="sidebar" aria-label="Stationery">
      <div class="sb-head">
        <span class="sb-title">Stationery</span>
        <span class="sb-hint">drag onto a page</span>
      </div>
      <div id="sbSections"></div>
    </aside>
    <div id="sbScrim"></div>

    <main id="bookArea">
      <div id="bookScale">
        <div id="book">
          <div class="book-edges left" aria-hidden="true"></div>
          <div class="book-edges right" aria-hidden="true"></div>
          <div class="book-ribbon" aria-hidden="true"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="itemToolbar" class="floating-toolbar" hidden></div>
  <div id="textToolbar" class="floating-toolbar text" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <input type="file" id="photoInput" accept="image/*" hidden>
  <div id="dragGhost" hidden></div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/book.js"></script>
  <script src="js/items.js"></script>
  <script src="js/edit-tools.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
